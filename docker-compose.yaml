services:
  node:
    build: .
    container_name: avshell-node2025q4-app
    image: avshell-node2025q4-app-image
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
    ports:
      - ${PORT}:${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      - PORT=${PORT}
    env_file:
      - .env
    volumes:
      - ./logs:/usr/src/app/logs
    networks:
      - custom-network
  postgres:
    build: ./db/
    container_name: avshell-node2025q4-postgres
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    restart: always
    environment:
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    command:
      - postgres
      - -c
      - port=${POSTGRES_PORT}
      - -c
      - logging_collector=on
      - -c
      - log_filename=postgresql.log
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data_volume:/var/lib/postgresql/data
    networks:
      - custom-network

volumes:
  db_data_volume:
networks:
  custom-network:
    driver: bridge
